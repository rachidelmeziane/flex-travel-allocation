[project]
name = "flex-travel-allocation"
version = "0.1.0"
description = "Allocate SNCB Flex subscription sales to travels (pax), travel dates and travel hours."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyspark==3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flex_travel_allocation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]

[tool.ruff.lint.pep8-naming]
# Allow the conventional Spark functions alias `sf`.
ignore-names = ["sf"]
